services:
  miniploy:
    image: ghcr.io/itsamenathan/miniploy:latest
    restart: unless-stopped
    environment:
      GIT_URL: https://github.com/your-org/your-app.git
      GIT_BRANCH: main
      GIT_AUTH_MODE: none

      IMAGE_NAME: your-app:live

      COMPOSE_FILE: /compose/compose.yaml
      COMPOSE_PROJECT_NAME: your-app
      COMPOSE_SERVICE: app
      COMPOSE_PROFILE: app

      CHECK_INTERVAL: 5m
      KEEP_BUILDS: 3
      DEPLOY_ON_START: true
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/compose:ro
      - miniploy-data:/data

  app:
    profiles:
      - app
    image: your-app:live
    restart: unless-stopped
    networks:
      - app_net
    ports:
      - "8080:8080"

networks:
  app_net:
    driver: bridge

volumes:
  miniploy-data:
